<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>待办倒计时</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="./view.css" />
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="head-main">
        <h1>待办倒计时</h1>
        <p class="sub">按截止日算剩余天数 · 逾期 / 今天 / 临期分色</p>
      </div>

      <div class="chips" id="chips" role="group" aria-label="按状态筛选"></div>

      <div class="tools">
        <label class="sel">
          <span>阈值</span>
          <select id="warnDays" aria-label="临期阈值（天）">
            <option value="1">1 天内</option>
            <option value="3">3 天内</option>
            <option value="7">7 天内</option>
            <option value="14">14 天内</option>
          </select>
        </label>
        <label class="switch"><input type="checkbox" id="showDone" /><span>已完成</span></label>
        <button class="ghost" id="refresh" type="button">刷新</button>
      </div>
    </header>

    <div class="alert" id="alert" hidden role="status" aria-live="polite">
      <span class="alert-text" id="alertText"></span>
      <button type="button" id="alertClose" aria-label="关闭提醒">✕</button>
    </div>

    <main id="list" aria-live="polite"></main>

    <footer class="foot">
      <span id="updated">正在读取…</span>
      <span class="dot">·</span>
      <span>每 60 秒自动刷新，跨天 00:00 自动换日</span>
      <span class="dot">·</span>
      <span id="mode">数据来自 x-hub 待办</span>
    </footer>
  </div>

  <div class="badge-preview" id="previewBadge" hidden>预览模式（模拟数据）</div>

  <script src="../shared/countdown.js"></script>
  <script src="../shared/mock-bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
